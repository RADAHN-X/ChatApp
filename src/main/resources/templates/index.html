<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-dark: #2C3E50;
            --primary-light: #34495E;
            --accent-color: #E74C3C;
            --secondary-accent: #3498DB;
            --text-light: #ECF0F1;
            --text-dark: #2C3E50;
            --gradient-start: #FD746C;
            --gradient-end: #2C3E50;
            --border-radius-lg: 16px;
            --border-radius-sm: 8px;
            --box-shadow: 0 15px 30px rgba(0, 0, 0, 0.12);
            --transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            color: var(--text-light);
            min-height: 100vh;
            overflow: hidden;
        }

        /* Glassmorphism Container */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        /* Navbar */
        .navbar {
            background: rgba(255, 255, 255, 0.1);
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-brand {
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            color: white;
            font-size: 1.5rem;
            text-decoration: none;
        }

        .logout-btn {
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 1.2rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .logout-btn:hover {
            color: var(--accent-color);
        }

        /* Main Content */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 300px;
            background: rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-title {
            font-weight: 600;
            color: white;
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }

        .current-user {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .current-user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .current-user-info {
            display: flex;
            flex-direction: column;
        }

        .current-user-name {
            font-weight: 500;
            font-size: 0.95rem;
            color: white;
        }

        .current-user-status {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #2ecc71;
        }

        .users-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
        }

        .user-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 0.25rem;
            color: white;
        }

        .user-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .user-item.active {
            background: rgba(231, 76, 60, 0.2);
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .user-info {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-weight: 500;
            font-size: 0.95rem;
            color: white;
        }

        .user-status {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .user-notification {
            background-color: var(--accent-color);
            color: white;
            font-size: 0.7rem;
            padding: 0.15rem 0.4rem;
            border-radius: 10px;
            display: none;
        }

        .user-notification.active {
            display: block;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.03);
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 2rem;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: rgba(255, 255, 255, 0.3);
        }

        .empty-state-title {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: white;
            font-size: 1.5rem;
        }

        .empty-state-description {
            max-width: 400px;
            margin-bottom: 1.5rem;
        }

        /* Chat Header */
        .chat-header {
            padding: 1.25rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: none;
            align-items: center;
            gap: 0.75rem;
        }

        .chat-header-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .chat-header-info {
            flex: 1;
        }

        .chat-header-name {
            font-weight: 600;
            color: white;
        }

        .chat-header-status {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.7);
        }

        /* Chat Messages */
        .chat-messages {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: none;
            flex-direction: column;
            gap: 0.75rem;
        }

        .message {
            max-width: 70%;
            padding: 0.75rem 1rem;
            border-radius: var(--border-radius-sm);
            font-size: 0.95rem;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease-out;
            color: white;
        }

        .message.sent {
            align-self: flex-end;
            background: rgba(231, 76, 60, 0.3);
            border: 1px solid rgba(231, 76, 60, 0.4);
        }

        .message.received {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .message-time {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-top: 0.25rem;
            display: block;
            text-align: right;
        }

        /* Chat Input */
        .chat-input {
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: none;
        }

        .message-form {
            display: flex;
            gap: 0.75rem;
        }

        .message-input {
            flex: 1;
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--border-radius-sm);
            color: white;
            font-size: 0.95rem;
            transition: var(--transition);
            outline: none;
        }

        .message-input:focus {
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.2);
        }

        .send-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: var(--border-radius-sm);
            padding: 0 1.5rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            background: #c0392b;
        }

        /* Message Image */
        .message-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            transition: var(--transition);
        }

        .message-image:hover {
            opacity: 0.9;
        }

        /* Image Preview */
        .image-preview-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .image-preview {
            max-width: 90%;
            max-height: 90%;
        }

        .close-preview {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 2rem;
            cursor: pointer;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                position: absolute;
                z-index: 100;
                height: 100%;
            }

            .chat-area {
                display: none;
            }

            .chat-area.active {
                display: flex;
            }
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- Navbar -->
    <nav class="navbar">
        <a class="navbar-brand" href="#">ChatApp</a>
        <button class="logout-btn" id="logout">
            <i class="fas fa-sign-out-alt"></i>
        </button>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h3 class="sidebar-title">Contacts</h3>
                <div class="current-user">
                    <div class="current-user-avatar" id="current-user-avatar"></div>
                    <div class="current-user-info">
                        <span class="current-user-name" id="connected-user-fullname"></span>
                        <span class="current-user-status">
                            <span class="status-indicator"></span>
                            <span>Online</span>
                        </span>
                    </div>
                </div>
            </div>
            <div class="users-list" id="connectedUsers"></div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area">
            <!-- Empty State -->
            <div class="empty-state" id="empty-state">
                <div class="empty-state-icon">
                    <i class="fas fa-comments"></i>
                </div>
                <h4 class="empty-state-title">No conversation selected</h4>
                <p class="empty-state-description">
                    Select a contact from the sidebar to start chatting or send a new message.
                </p>
            </div>

            <!-- Chat Header -->
            <div class="chat-header" id="chat-header">
                <div class="chat-header-avatar" id="chat-header-avatar"></div>
                <div class="chat-header-info">
                    <div class="chat-header-name" id="chat-header-name"></div>
                    <div class="chat-header-status">Online</div>
                </div>
            </div>

            <!-- Chat Messages -->
            <div class="chat-messages" id="chat-messages"></div>

            <!-- Chat Input -->
            <div class="chat-input" id="chat-input">
                <form id="messageForm" name="messageForm" class="message-form">
                    <input type="text" id="message" class="message-input" placeholder="Type a message..." autocomplete="off">
                    <button type="submit" class="send-btn">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Image Preview Modal -->
<div class="image-preview-container" id="imagePreviewContainer">
    <span class="close-preview">&times;</span>
    <img class="image-preview" id="imagePreview">
</div>

<!-- Hidden File Input -->
<input type="file" id="fileInput" accept="image/*" style="display: none;">

<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.1.4/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script>
    // DOM Elements
    const messageForm = document.querySelector('#messageForm');
    const messageInput = document.querySelector('#message');
    const chatMessages = document.querySelector('#chat-messages');
    const logoutBtn = document.querySelector('#logout');
    const emptyState = document.querySelector('#empty-state');
    const chatHeader = document.querySelector('#chat-header');
    const chatInput = document.querySelector('#chat-input');
    const currentUserAvatar = document.querySelector('#current-user-avatar');
    const chatHeaderAvatar = document.querySelector('#chat-header-avatar');
    const chatHeaderName = document.querySelector('#chat-header-name');
    const fileInput = document.getElementById('fileInput');
    const imagePreviewContainer = document.getElementById('imagePreviewContainer');
    const imagePreview = document.getElementById('imagePreview');
    const closePreview = document.querySelector('.close-preview');

    // Variables
    let selectedUserId = null;
    let stompClient = null;
    const username = '[[${username}]]';
    const notificationState = {};

    // Initialize
    function init() {
        currentUserAvatar.textContent = getInitials(username);
        connect();

        messageForm.addEventListener('submit', sendMessage);
        logoutBtn.addEventListener('click', onLogout);

        // Add image upload button
        const sendBtn = messageForm.querySelector('.send-btn');
        const uploadBtn = document.createElement('button');
        uploadBtn.type = 'button';
        uploadBtn.className = 'send-btn';
        uploadBtn.innerHTML = '<i class="fas fa-image"></i>';
        uploadBtn.style.marginRight = '0.5rem';
        uploadBtn.addEventListener('click', () => fileInput.click());
        messageForm.insertBefore(uploadBtn, sendBtn);

        fileInput.addEventListener('change', handleImageUpload);
        closePreview.addEventListener('click', () => {
            imagePreviewContainer.style.display = 'none';
        });
    }

    // WebSocket Connection
    function connect() {
        const socket = new SockJS('/ws');
        stompClient = Stomp.over(socket);
        stompClient.connect({}, onConnected);
    }

    function onConnected() {
        stompClient.subscribe(`/user/${username}/queue/messages`, onMessageReceived);
        stompClient.subscribe(`/user/public`, onMessageReceived);
        stompClient.send("/app/user.addUser", {}, JSON.stringify({ username: username, status: 'ONLINE' }));
        document.querySelector('#connected-user-fullname').textContent = username;
        findAndDisplayConnectedUsers();
    }

    // User Functions
    async function findAndDisplayConnectedUsers() {
        const connectedUsersResponse = await fetch('/users');
        let connectedUsers = await connectedUsersResponse.json();
        connectedUsers = connectedUsers.filter(user => user.username !== username);
        const connectedUsersList = document.getElementById('connectedUsers');
        connectedUsersList.innerHTML = '';
        connectedUsers.forEach(user => appendUserElement(user, connectedUsersList));
    }

    function appendUserElement(user, connectedUsersList) {
        const listItem = document.createElement('div');
        listItem.classList.add('user-item');
        listItem.id = user.username;

        const badgeVisible = notificationState[user.username] ? 'active' : '';

        listItem.innerHTML = `
            <div class="user-avatar">${getInitials(user.username)}</div>
            <div class="user-info">
                <div class="user-name">${user.username}</div>
                <div class="user-status">Online</div>
            </div>
            <div class="user-notification ${badgeVisible}" id="notify-${user.username}">New</div>
        `;

        listItem.addEventListener('click', () => userItemClick(user));
        connectedUsersList.appendChild(listItem);
    }

    function userItemClick(user) {
        document.querySelectorAll('.user-item').forEach(item => {
            item.classList.remove('active');
        });

        const clickedUser = document.getElementById(user.username);
        if (clickedUser) clickedUser.classList.add('active');

        emptyState.style.display = 'none';
        chatHeader.style.display = 'flex';
        chatMessages.style.display = 'flex';
        chatInput.style.display = 'block';

        selectedUserId = user.username;
        chatHeaderName.textContent = user.username;
        chatHeaderAvatar.textContent = getInitials(user.username);

        const notificationBadge = document.getElementById(`notify-${selectedUserId}`);
        if (notificationBadge) notificationBadge.classList.remove('active');

        delete notificationState[selectedUserId];
        fetchAndDisplayUserChat();
    }

    // Chat Functions
    async function fetchAndDisplayUserChat() {
        const userChatResponse = await fetch(`/messages/${username}/${selectedUserId}`);
        const userChat = await userChatResponse.json();
        chatMessages.innerHTML = '';
        userChat.forEach(chat => {
            if (chat.type === 'IMAGE') {
                displayImageMessage(chat.senderId, chat.filePath, chat.timestamp);
            } else {
                displayMessage(chat.senderId, chat.content, chat.timestamp);
            }
        });
        scrollToBottom();
    }
    function formatDateTime(timestamp) {
        if (!timestamp) return '';

        const date = new Date(timestamp);
        const now = new Date();
        const diffInMinutes = Math.floor((now - date) / (1000 * 60));

        if (diffInMinutes < 1) {
            return 'Now';
        } else if (diffInMinutes < 60) {
            return `${diffInMinutes} minutes ago`;
        } else if (date.toDateString() === now.toDateString()) {
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        } else {
            return date.toLocaleDateString([], { year: 'numeric', month: 'short', day: 'numeric' });
        }
    }

    function displayMessage(senderId, content, timestamp) {
        const messageContainer = document.createElement('div');
        messageContainer.classList.add('message');
        messageContainer.classList.add(senderId === username ? 'sent' : 'received');

        messageContainer.innerHTML = `
        ${content}
        <span class="message-time">${formatDateTime(timestamp)}</span>
    `;

        chatMessages.appendChild(messageContainer);
        scrollToBottom();
    }

    function displayImageMessage(senderId, filePath, timestamp) {
        const messageContainer = document.createElement('div');
        messageContainer.classList.add('message');
        messageContainer.classList.add(senderId === username ? 'sent' : 'received');

        const imageUrl = `/uploads/${filePath}`;

        messageContainer.innerHTML = `
        <img src="${imageUrl}" class="message-image" onclick="showImagePreview('${imageUrl}')">
        <span class="message-time">${formatDateTime(timestamp)}</span>
    `;

        chatMessages.appendChild(messageContainer);
        scrollToBottom();
    }

    async function handleImageUpload(e) {
        const file = e.target.files[0];
        if (!file) return;

        if (!file.type.match('image.*')) {
            alert('Please select an image file (JPEG, PNG, GIF)');
            return;
        }

        if (file.size > 5 * 1024 * 1024) {
            alert('Image size should be less than 5MB');
            return;
        }

        const formData = new FormData();
        formData.append('file', file);

        try {
            const response = await fetch(`/images/${username}/${selectedUserId}`, {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                const message = await response.json();
                displayImageMessage(username, message.filePath);
            } else {
                const error = await response.text();
                alert(`Failed to send image: ${error}`);
            }
        } catch (error) {
            console.error('Error sending image:', error);
            alert('Error sending image. Please try again.');
        }

        fileInput.value = '';
    }

    function sendMessage(event) {
        event.preventDefault();
        const messageContent = messageInput.value.trim();

        if (messageContent && stompClient) {
            const chatMessage = {
                senderId: username,
                receiverId: selectedUserId,
                content: messageContent
            };

            stompClient.send("/app/chat", {}, JSON.stringify(chatMessage));
            displayMessage(username, messageContent, new Date());
            messageInput.value = '';
            scrollToBottom();
        }
    }

    function onMessageReceived(payload) {
        const message = JSON.parse(payload.body);
        notificationState[message.senderId] = true;

        findAndDisplayConnectedUsers().then(() => {
            Object.keys(notificationState).forEach(userId => {
                const notificationBadge = document.getElementById(`notify-${userId}`);
                if (notificationBadge) notificationBadge.classList.add('active');
            });
        });

        if (selectedUserId && selectedUserId === message.senderId) {
            if (message.content === 'Image') {
                fetch(`/messages/${username}/${selectedUserId}`)
                    .then(response => response.json())
                    .then(messages => {
                        const lastMessage = messages[messages.length - 1];
                        if (lastMessage.type === 'IMAGE') {
                            displayImageMessage(lastMessage.senderId, lastMessage.filePath, lastMessage.timestamp);
                        }
                    });
            } else {
                displayMessage(message.senderId, message.content, message.timestamp);
            }
            delete notificationState[message.senderId];
        }
    }

    // Utility Functions
    function getInitials(name) {
        return name.split(' ').map(n => n[0]).join('').toUpperCase();
    }

    function formatTime(date) {
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function scrollToBottom() {
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function onLogout() {
        stompClient.send("/app/user.disconnectUser", {}, JSON.stringify({ username: username, status: 'OFFLINE' }));
        window.location.href = '/logout';
    }

    // Global function for image preview
    window.showImagePreview = function(imageUrl) {
        imagePreview.src = imageUrl;
        imagePreviewContainer.style.display = 'flex';
    };

    // Initialize the application
    init();
</script>
</body>
</html>
