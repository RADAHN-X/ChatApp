<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Chat App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-dark: #2C3E50;
            --primary-light: #34495E;
            --accent-color: #E74C3C;
            --secondary-accent: #3498DB;
            --text-light: #ECF0F1;
            --text-dark: #2C3E50;
            --gradient-start: #FD746C;
            --gradient-end: #2C3E50;
            --border-radius-lg: 16px;
            --border-radius-sm: 8px;
            --box-shadow: 0 15px 30px rgba(0, 0, 0, 0.12);
            --transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            --weak-pass: #ff4757;
            --medium-pass: #ffa502;
            --strong-pass: #2ed573;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Glassmorphism Container */
        .auth-container {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--border-radius-lg);
            box-shadow: var(--box-shadow);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 1;
        }

        .auth-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
            z-index: -1;
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .auth-header {
            padding: 40px 40px 20px;
            text-align: center;
            position: relative;
        }

        .auth-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: white;
            letter-spacing: 1px;
        }

        .auth-header p {
            font-size: 0.95rem;
            opacity: 0.8;
            margin-bottom: 0;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .logo i {
            font-size: 2.5rem;
            color: white;
        }

        .auth-body {
            padding: 0 40px 40px;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            color: white;
        }

        .input-with-icon {
            position: relative;
        }

        .form-control {
            width: 100%;
            padding: 15px 20px 15px 50px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--border-radius-sm);
            color: white;
            font-size: 1rem;
            transition: var(--transition);
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            outline: none;
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.2);
        }

        .input-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 1.1rem;
            opacity: 0.8;
            z-index: 2;
        }

        .btn-auth {
            width: 100%;
            padding: 15px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: var(--border-radius-sm);
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 10px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-auth:hover {
            background: #c0392b;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .auth-footer {
            text-align: center;
            padding: 20px 40px;
            background: rgba(0, 0, 0, 0.1);
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .auth-footer a {
            color: var(--secondary-accent);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            position: relative;
        }

        .auth-footer a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--secondary-accent);
            transition: var(--transition);
        }

        .auth-footer a:hover::after {
            width: 100%;
        }

        .alert-danger {
            background: rgba(231, 76, 60, 0.2);
            color: white;
            border: 1px solid rgba(231, 76, 60, 0.4);
            border-radius: var(--border-radius-sm);
            padding: 12px;
            margin-top: 20px;
            font-size: 0.9rem;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        .alert-danger i {
            margin-right: 8px;
        }

        /* Password Strength Meter */
        .password-strength {
            margin-top: 10px;
            height: 5px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            overflow: hidden;
        }

        .strength-meter {
            height: 100%;
            width: 0;
            transition: var(--transition);
        }

        .password-hints {
            margin-top: 10px;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.7);
        }

        .password-hints ul {
            list-style: none;
            padding-left: 5px;
            margin-top: 8px;
        }

        .password-hints li {
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            transition: var(--transition);
        }

        .password-hints i {
            margin-right: 8px;
            font-size: 0.7rem;
        }

        .valid-hint {
            color: var(--strong-pass);
        }

        .invalid-hint {
            color: rgba(255,255,255,0.4);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Floating Circles Background */
        .circles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -2;
        }

        .circles li {
            position: absolute;
            display: block;
            list-style: none;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            animation: float 25s linear infinite;
            bottom: -150px;
            border-radius: 50%;
        }

        .circles li:nth-child(1) {
            left: 25%;
            width: 80px;
            height: 80px;
            animation-delay: 0s;
        }

        .circles li:nth-child(2) {
            left: 10%;
            width: 20px;
            height: 20px;
            animation-delay: 2s;
            animation-duration: 12s;
        }

        .circles li:nth-child(3) {
            left: 70%;
            width: 20px;
            height: 20px;
            animation-delay: 4s;
        }

        .circles li:nth-child(4) {
            left: 40%;
            width: 60px;
            height: 60px;
            animation-delay: 0s;
            animation-duration: 18s;
        }

        .circles li:nth-child(5) {
            left: 65%;
            width: 20px;
            height: 20px;
            animation-delay: 0s;
        }

        .circles li:nth-child(6) {
            left: 75%;
            width: 110px;
            height: 110px;
            animation-delay: 3s;
        }

        .circles li:nth-child(7) {
            left: 35%;
            width: 150px;
            height: 150px;
            animation-delay: 7s;
        }

        .circles li:nth-child(8) {
            left: 50%;
            width: 25px;
            height: 25px;
            animation-delay: 15s;
            animation-duration: 45s;
        }

        .circles li:nth-child(9) {
            left: 20%;
            width: 15px;
            height: 15px;
            animation-delay: 2s;
            animation-duration: 35s;
        }

        .circles li:nth-child(10) {
            left: 85%;
            width: 150px;
            height: 150px;
            animation-delay: 0s;
            animation-duration: 11s;
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
                border-radius: 0;
            }
            100% {
                transform: translateY(-1000px) rotate(720deg);
                opacity: 0;
                border-radius: 50%;
            }
        }

        /* Responsive Design */
        @media (max-width: 576px) {
            .auth-container {
                max-width: 100%;
            }

            .auth-header, .auth-body {
                padding: 30px 20px;
            }

            .auth-header h2 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

<!-- Floating Background Elements -->
<ul class="circles">
    <li></li>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
</ul>

<div class="auth-container">
    <div class="auth-header">
        <div class="logo">
            <i class="fas fa-user-plus"></i>
        </div>
        <h2>Create Your Account</h2>
        <p>Join our community to start chatting</p>
    </div>

    <div class="auth-body">
        <form method="post" action="/register">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <div class="input-with-icon">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="username" class="form-control" name="username" placeholder="Choose a username" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div class="input-with-icon">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" class="form-control" name="password" placeholder="Create a password" required>
                </div>
                <div class="password-strength">
                    <div class="strength-meter" id="strength-meter"></div>
                </div>
                <div class="password-hints">
                    <ul>
                        <li id="length-hint"><i class="fas fa-check-circle"></i> At least 8 characters</li>
                        <li id="uppercase-hint"><i class="fas fa-check-circle"></i> Include uppercase letters</li>
                        <li id="number-hint"><i class="fas fa-check-circle"></i> Include numbers</li>
                    </ul>
                </div>
            </div>

            <button type="submit" class="btn-auth">
                <i class="fas fa-user-plus"></i> REGISTER
            </button>

            <div th:if="${error}" class="alert-danger mt-4">
                <i class="fas fa-exclamation-triangle"></i> <span th:text="${error}">Username already exists</span>
            </div>
        </form>
    </div>

    <div class="auth-footer">
        Already have an account? <a href="/login">Sign in</a>
    </div>
</div>

<script>
    // Password strength indicator
    const passwordInput = document.getElementById('password');
    const strengthMeter = document.getElementById('strength-meter');
    const lengthHint = document.getElementById('length-hint');
    const uppercaseHint = document.getElementById('uppercase-hint');
    const numberHint = document.getElementById('number-hint');

    passwordInput.addEventListener('input', function() {
        const password = this.value;
        let strength = 0;
        let hasLength = false;
        let hasUppercase = false;
        let hasNumber = false;

        // Check for length
        if (password.length >= 8) {
            strength += 25;
            hasLength = true;
            lengthHint.classList.add('valid-hint');
            lengthHint.classList.remove('invalid-hint');
            lengthHint.querySelector('i').className = 'fas fa-check-circle';
        } else {
            lengthHint.classList.remove('valid-hint');
            lengthHint.classList.add('invalid-hint');
            lengthHint.querySelector('i').className = 'fas fa-times-circle';
        }

        // Check for uppercase letters
        if (/[A-Z]/.test(password)) {
            strength += 20;
            hasUppercase = true;
            uppercaseHint.classList.add('valid-hint');
            uppercaseHint.classList.remove('invalid-hint');
            uppercaseHint.querySelector('i').className = 'fas fa-check-circle';
        } else {
            uppercaseHint.classList.remove('valid-hint');
            uppercaseHint.classList.add('invalid-hint');
            uppercaseHint.querySelector('i').className = 'fas fa-times-circle';
        }

        // Check for numbers
        if (/[0-9]/.test(password)) {
            strength += 20;
            hasNumber = true;
            numberHint.classList.add('valid-hint');
            numberHint.classList.remove('invalid-hint');
            numberHint.querySelector('i').className = 'fas fa-check-circle';
        } else {
            numberHint.classList.remove('valid-hint');
            numberHint.classList.add('invalid-hint');
            numberHint.querySelector('i').className = 'fas fa-times-circle';
        }

        // Check for special characters
        if (/[^A-Za-z0-9]/.test(password)) strength += 20;

        // Update strength meter
        strengthMeter.style.width = Math.min(strength, 100) + '%';

        // Update color based on strength
        if (strength < 40) {
            strengthMeter.style.background = 'var(--weak-pass)';
        } else if (strength < 70) {
            strengthMeter.style.background = 'var(--medium-pass)';
        } else {
            strengthMeter.style.background = 'var(--strong-pass)';
        }
    });
</script>

</body>
</html>
