<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --accent-color: #4895ef;
            --light-color: #f8f9fa;
            --dark-color: #212529;
            --success-color: #4cc9f0;
            --danger-color: #f72585;
            --warning-color: #f8961e;
            --info-color: #4895ef;
            --border-radius: 12px;
            --box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #f5f7fb;
            color: var(--dark-color);
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Navbar */
        .navbar {
            background-color: white;
            box-shadow: var(--box-shadow);
            padding: 0.8rem 2rem;
            z-index: 1000;
        }

        .navbar-brand {
            font-weight: 700;
            color: var(--primary-color);
            font-size: 1.5rem;
        }

        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logout-btn {
            background: none;
            border: none;
            color: var(--danger-color);
            font-size: 1.2rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .logout-btn:hover {
            transform: scale(1.1);
        }

        /* Main Content */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 300px;
            background-color: white;
            border-right: 1px solid #e9ecef;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid #e9ecef;
        }

        .sidebar-title {
            font-weight: 600;
            color: var(--dark-color);
            margin-bottom: 0.5rem;
        }

        .current-user {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .current-user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background-color: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .current-user-info {
            display: flex;
            flex-direction: column;
        }

        .current-user-name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .current-user-status {
            font-size: 0.75rem;
            color: #6c757d;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #28a745;
        }

        .users-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
        }

        .user-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 0.25rem;
        }

        .user-item:hover {
            background-color: #f8f9fa;
        }

        .user-item.active {
            background-color: rgba(67, 97, 238, 0.1);
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background-color: var(--accent-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .user-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .user-name {
            font-weight: 600;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-status {
            font-size: 0.75rem;
            color: #6c757d;
        }

        .user-notification {
            background-color: var(--danger-color);
            color: white;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.15rem 0.4rem;
            border-radius: 10px;
            display: none;
        }

        .user-notification.active {
            display: block;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #f8f9fa;
        }

        .chat-header {
            padding: 1.25rem 1.5rem;
            background-color: white;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .chat-header-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background-color: var(--warning-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .chat-header-info {
            flex: 1;
        }

        .chat-header-name {
            font-weight: 600;
        }

        .chat-header-status {
            font-size: 0.75rem;
            color: #6c757d;
        }

        .chat-messages {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .message {
            max-width: 70%;
            padding: 0.75rem 1rem;
            border-radius: var(--border-radius);
            font-size: 0.95rem;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
        }

        .message.sent {
            align-self: flex-end;
            background-color: var(--primary-color);
            color: white;
            border-top-right-radius: 4px;
        }

        .message.received {
            align-self: flex-start;
            background-color: white;
            color: var(--dark-color);
            border: 1px solid #e9ecef;
            border-top-left-radius: 4px;
        }

        .message-time {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-top: 0.25rem;
            display: block;
            text-align: right;
        }

        .chat-input {
            padding: 1rem;
            background-color: white;
            border-top: 1px solid #e9ecef;
        }

        .message-form {
            display: flex;
            gap: 0.75rem;
        }

        .message-input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid #e9ecef;
            border-radius: var(--border-radius);
            outline: none;
            transition: var(--transition);
            font-size: 0.95rem;
        }

        .message-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }

        .send-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            padding: 0 1.5rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            background-color: var(--secondary-color);
        }

        .send-btn i {
            font-size: 1.2rem;
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 2rem;
            text-align: center;
            color: #6c757d;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #dee2e6;
        }

        .empty-state-title {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--dark-color);
        }

        .empty-state-description {
            max-width: 400px;
            margin-bottom: 1.5rem;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message {
            animation: fadeIn 0.3s ease-out;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 250px;
            }
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- Navbar -->
    <nav class="navbar">
        <a class="navbar-brand" href="#">ChatApp</a>
        <div class="navbar-actions">
            <button class="logout-btn" id="logout" title="Logout">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h3 class="sidebar-title">Contacts</h3>
                <div class="current-user">
                    <div class="current-user-avatar" id="current-user-avatar">
                        <!-- Initial will be inserted by JS -->
                    </div>
                    <div class="current-user-info">
                        <span class="current-user-name" id="connected-user-fullname"></span>
                        <span class="current-user-status">
                                <span class="status-indicator"></span>
                                <span>Online</span>
                            </span>
                    </div>
                </div>
            </div>
            <div class="users-list" id="connectedUsers"></div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area">
            <!-- Empty State (shown when no chat is selected) -->
            <div class="empty-state" id="empty-state">
                <div class="empty-state-icon">
                    <i class="fas fa-comments"></i>
                </div>
                <h4 class="empty-state-title">No conversation selected</h4>
                <p class="empty-state-description">
                    Select a contact from the sidebar to start chatting or send a new message.
                </p>
            </div>

            <!-- Chat Header (shown when chat is selected) -->
            <div class="chat-header" id="chat-header" style="display: none;">
                <div class="chat-header-avatar" id="chat-header-avatar">
                    <!-- Initial will be inserted by JS -->
                </div>
                <div class="chat-header-info">
                    <div class="chat-header-name" id="chat-header-name"></div>
                    <div class="chat-header-status">Online</div>
                </div>
            </div>

            <!-- Messages (shown when chat is selected) -->
            <div class="chat-messages" id="chat-messages" style="display: none;"></div>

            <!-- Message Input (shown when chat is selected) -->
            <div class="chat-input" id="chat-input" style="display: none;">
                <form id="messageForm" name="messageForm" class="message-form">
                    <input type="text" id="message" class="message-input" placeholder="Type a message..." autocomplete="off">
                    <button type="submit" class="send-btn">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.1.4/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script>
    // DOM Elements
    const messageForm = document.querySelector('#messageForm');
    const messageInput = document.querySelector('#message');
    const chatMessages = document.querySelector('#chat-messages');
    const logoutBtn = document.querySelector('#logout');
    const emptyState = document.querySelector('#empty-state');
    const chatHeader = document.querySelector('#chat-header');
    const chatInput = document.querySelector('#chat-input');
    const currentUserAvatar = document.querySelector('#current-user-avatar');
    const chatHeaderAvatar = document.querySelector('#chat-header-avatar');
    const chatHeaderName = document.querySelector('#chat-header-name');

    // Variables
    let selectedUserId = null;
    let stompClient = null;
    const username = '[[${username}]]';
    const notificationState = {}; // Keeps track of notifications for each user

    // Initialize
    function init() {
        // Set current user avatar
        currentUserAvatar.textContent = getInitials(username);

        // Connect to WebSocket
        connect();

        // Event listeners
        messageForm.addEventListener('submit', sendMessage);
        logoutBtn.addEventListener('click', onLogout);
    }

    // WebSocket Connection
    function connect() {
        const socket = new SockJS('/ws');
        stompClient = Stomp.over(socket);
        stompClient.connect({}, onConnected);
    }

    function onConnected() {
        stompClient.subscribe(`/user/${username}/queue/messages`, onMessageReceived);
        stompClient.subscribe(`/user/public`, onMessageReceived);
        stompClient.send("/app/user.addUser", {}, JSON.stringify({ username: username, status: 'ONLINE' }));
        document.querySelector('#connected-user-fullname').textContent = username;
        findAndDisplayConnectedUsers();
    }

    // User Functions
    async function findAndDisplayConnectedUsers() {
        const connectedUsersResponse = await fetch('/users');
        let connectedUsers = await connectedUsersResponse.json();
        connectedUsers = connectedUsers.filter(user => user.username !== username);
        const connectedUsersList = document.getElementById('connectedUsers');
        connectedUsersList.innerHTML = '';
        connectedUsers.forEach(user => appendUserElement(user, connectedUsersList));
    }

    function appendUserElement(user, connectedUsersList) {
        const listItem = document.createElement('div');
        listItem.classList.add('user-item');
        listItem.id = user.username;

        const badgeVisible = notificationState[user.username] ? 'active' : '';

        listItem.innerHTML = `
                <div class="user-avatar">${getInitials(user.username)}</div>
                <div class="user-info">
                    <div class="user-name">${user.username}</div>
                    <div class="user-status">Online</div>
                </div>
                <div class="user-notification ${badgeVisible}" id="notify-${user.username}">New</div>
            `;

        listItem.addEventListener('click', () => userItemClick(user));
        connectedUsersList.appendChild(listItem);
    }

    function userItemClick(user) {
        // Remove active class from all user items
        document.querySelectorAll('.user-item').forEach(item => {
            item.classList.remove('active');
        });

        // Add active class to clicked user
        const clickedUser = document.getElementById(user.username);
        if (clickedUser) {
            clickedUser.classList.add('active');
        }

        // Show chat area
        emptyState.style.display = 'none';
        chatHeader.style.display = 'flex';
        chatMessages.style.display = 'flex';
        chatInput.style.display = 'block';

        // Set selected user
        selectedUserId = user.username;

        // Update chat header
        chatHeaderName.textContent = user.username;
        chatHeaderAvatar.textContent = getInitials(user.username);

        // Clear the notification badge
        const notificationBadge = document.getElementById(`notify-${selectedUserId}`);
        if (notificationBadge) {
            notificationBadge.classList.remove('active');
        }

        // Update the notification state
        delete notificationState[selectedUserId];

        // Load chat history
        fetchAndDisplayUserChat();
    }

    // Chat Functions
    async function fetchAndDisplayUserChat() {
        const userChatResponse = await fetch(`/messages/${username}/${selectedUserId}`);
        const userChat = await userChatResponse.json();
        chatMessages.innerHTML = '';
        userChat.forEach(chat => displayMessage(chat.senderId, chat.content));
        scrollToBottom();
    }

    function displayMessage(senderId, content) {
        const messageContainer = document.createElement('div');
        messageContainer.classList.add('message');

        if (senderId === username) {
            messageContainer.classList.add('sent');
        } else {
            messageContainer.classList.add('received');
        }

        messageContainer.innerHTML = `
                ${content}
                <span class="message-time">${formatTime(new Date())}</span>
            `;

        chatMessages.appendChild(messageContainer);
        scrollToBottom();
    }

    function sendMessage(event) {
        event.preventDefault();
        const messageContent = messageInput.value.trim();

        if (messageContent && stompClient) {
            const chatMessage = {
                senderId: username,
                receiverId: selectedUserId,
                content: messageContent,
                timestamp: new Date()
            };

            stompClient.send("/app/chat", {}, JSON.stringify(chatMessage));
            displayMessage(username, messageContent);
            messageInput.value = '';
            scrollToBottom();
        }
    }

    function onMessageReceived(payload) {
        const message = JSON.parse(payload.body);

        // Update notification state
        notificationState[message.senderId] = true;

        // Refresh user list and reapply notification state
        findAndDisplayConnectedUsers().then(() => {
            Object.keys(notificationState).forEach(userId => {
                if (notificationState[userId]) {
                    const notificationBadge = document.getElementById(`notify-${userId}`);
                    if (notificationBadge) {
                        notificationBadge.classList.add('active');
                    }
                }
            });
        });

        if (selectedUserId && selectedUserId === message.senderId) {
            displayMessage(message.senderId, message.content);
            delete notificationState[message.senderId]; // Clear notification if chat is open
        }
    }

    // Utility Functions
    function getInitials(name) {
        return name.split(' ').map(n => n[0]).join('').toUpperCase();
    }

    function formatTime(date) {
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function scrollToBottom() {
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function onLogout() {
        stompClient.send("/app/user.disconnectUser", {}, JSON.stringify({ username: username, status: 'OFFLINE' }));
        window.location.href = '/logout';
    }

    // Initialize the app
    init();
</script>
</body>
</html>
